name: Preview Sync Cron

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: preview-sync-cron
  cancel-in-progress: false

jobs:
  warm-preview-last-30d:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Validate required secrets
        env:
          PREVIEW_URL_1: ${{ secrets.PREVIEW_URL_1 }}
          STORE_IDS_1: ${{ secrets.STORE_IDS_1 }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_URL_1}" ]; then
            echo "Missing required secret: PREVIEW_URL_1"
            exit 1
          fi
          if [ -z "${STORE_IDS_1}" ]; then
            echo "Missing required secret: STORE_IDS_1"
            exit 1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "Missing required secret: CRON_SECRET"
            exit 1
          fi

      - name: Prewarm rolling 30-day campaigns cache for each store
        env:
          PREVIEW_URL_1: ${{ secrets.PREVIEW_URL_1 }}
          STORE_IDS_1: ${{ secrets.STORE_IDS_1 }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_BYPASS_TOKEN_1: ${{ secrets.VERCEL_BYPASS_TOKEN_1 }}
        run: |
          set -euo pipefail
          BASE="${PREVIEW_URL_1%/}"
          TODAY="$(date -u +'%Y-%m-%d')"
          SINCE="$(date -u -d '29 days ago' +'%Y-%m-%d')"
          echo "Warming 30-day cache for range ${SINCE} -> ${TODAY} at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          IFS=',' read -r -a STORES <<< "${STORE_IDS_1}"
          if [ "${#STORES[@]}" -eq 0 ]; then
            echo "No store IDs found in STORE_IDS_1"
            exit 1
          fi

          FAILED=0
          for RAW in "${STORES[@]}"; do
            STORE_ID="$(echo "${RAW}" | xargs)"
            if [ -z "${STORE_ID}" ]; then
              continue
            fi
            URL="${BASE}/api/sync/prewarm-campaigns?storeId=${STORE_ID}&since=${SINCE}&until=${TODAY}"
            echo "Calling ${URL}"
            RESP_FILE="$(mktemp)"

            if [ -n "${VERCEL_BYPASS_TOKEN_1:-}" ]; then
              HTTP_CODE="$(curl -sS -L --retry 2 --retry-delay 2 --max-time 120 \
                -o "${RESP_FILE}" -w '%{http_code}' \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_TOKEN_1}" \
                "${URL}")"
            else
              HTTP_CODE="$(curl -sS -L --retry 2 --retry-delay 2 --max-time 120 \
                -o "${RESP_FILE}" -w '%{http_code}' \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                "${URL}")"
            fi

            if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
              echo "Warmed store ${STORE_ID} (HTTP ${HTTP_CODE})"
              cat "${RESP_FILE}"
            else
              echo "Failed store ${STORE_ID} (HTTP ${HTTP_CODE})"
              cat "${RESP_FILE}"
              FAILED=$((FAILED + 1))
            fi
            rm -f "${RESP_FILE}"
          done

          if [ "${FAILED}" -gt 0 ]; then
            echo "30-day prewarm completed with ${FAILED} failed store(s)"
            exit 1
          fi

          echo "30-day prewarm completed successfully"
