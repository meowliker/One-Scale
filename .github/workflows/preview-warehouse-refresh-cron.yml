name: Preview Warehouse Refresh Cron

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: preview-warehouse-refresh-cron
  cancel-in-progress: false

jobs:
  refresh-warehouse-per-store:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate required secrets
        env:
          PREVIEW_URL_1: ${{ secrets.PREVIEW_URL_1 }}
          STORE_IDS_1: ${{ secrets.STORE_IDS_1 }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_URL_1}" ]; then
            echo "Missing required secret: PREVIEW_URL_1"
            exit 1
          fi
          if [ -z "${STORE_IDS_1}" ]; then
            echo "Missing required secret: STORE_IDS_1"
            exit 1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "Missing required secret: CRON_SECRET"
            exit 1
          fi

      - name: Refresh warehouse snapshots + materialize via /api/sync/refresh (store-by-store)
        env:
          PREVIEW_URL_1: ${{ secrets.PREVIEW_URL_1 }}
          STORE_IDS_1: ${{ secrets.STORE_IDS_1 }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_BYPASS_TOKEN_1: ${{ secrets.VERCEL_BYPASS_TOKEN_1 }}
        run: |
          set -euo pipefail
          BASE="${PREVIEW_URL_1%/}"
          echo "Starting preview warehouse refresh at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          IFS=',' read -r -a STORES <<< "${STORE_IDS_1}"
          if [ "${#STORES[@]}" -eq 0 ]; then
            echo "No store IDs found in STORE_IDS_1"
            exit 1
          fi

          FAILED=0
          RATE_LIMITED=0
          for RAW in "${STORES[@]}"; do
            STORE_ID="$(echo "${RAW}" | xargs)"
            if [ -z "${STORE_ID}" ]; then
              continue
            fi

            URL="${BASE}/api/sync/refresh"
            PAYLOAD="$(printf '{"storeId":"%s","warehouseMode":true}' "${STORE_ID}")"
            echo "Refreshing warehouse for store ${STORE_ID} via ${URL}"
            ATTEMPT=1
            STORE_DONE=0
            while [ "${ATTEMPT}" -le 3 ]; do
              RESP_FILE="$(mktemp)"
              if [ -n "${VERCEL_BYPASS_TOKEN_1:-}" ]; then
                HTTP_CODE="$(curl -sS -L --retry 2 --retry-delay 2 --max-time 900 \
                  -o "${RESP_FILE}" -w '%{http_code}' \
                  -X POST \
                  -H "Authorization: Bearer ${CRON_SECRET}" \
                  -H "Content-Type: application/json" \
                  -H "x-vercel-protection-bypass: ${VERCEL_BYPASS_TOKEN_1}" \
                  --data "${PAYLOAD}" \
                  "${URL}")"
              else
                HTTP_CODE="$(curl -sS -L --retry 2 --retry-delay 2 --max-time 900 \
                  -o "${RESP_FILE}" -w '%{http_code}' \
                  -X POST \
                  -H "Authorization: Bearer ${CRON_SECRET}" \
                  -H "Content-Type: application/json" \
                  --data "${PAYLOAD}" \
                  "${URL}")"
              fi

              if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
                echo "Store ${STORE_ID} refreshed (HTTP ${HTTP_CODE}, attempt ${ATTEMPT})"
                cat "${RESP_FILE}"
                rm -f "${RESP_FILE}"
                STORE_DONE=1
                break
              fi

              if [ "${HTTP_CODE}" = "429" ]; then
                echo "Store ${STORE_ID} rate limited (HTTP 429, attempt ${ATTEMPT})"
                cat "${RESP_FILE}"
                rm -f "${RESP_FILE}"
                if [ "${ATTEMPT}" -lt 3 ]; then
                  echo "Waiting 95 seconds before retry..."
                  sleep 95
                  ATTEMPT=$((ATTEMPT + 1))
                  continue
                fi
                echo "Store ${STORE_ID} still rate limited after 3 attempts; skipping for now"
                RATE_LIMITED=$((RATE_LIMITED + 1))
                STORE_DONE=1
                break
              fi

              if [ "${HTTP_CODE}" -ge 500 ] && [ "${HTTP_CODE}" -lt 600 ]; then
                echo "Store ${STORE_ID} server error (HTTP ${HTTP_CODE}, attempt ${ATTEMPT})"
                cat "${RESP_FILE}"
                rm -f "${RESP_FILE}"
                if [ "${ATTEMPT}" -lt 3 ]; then
                  echo "Waiting 45 seconds before retry..."
                  sleep 45
                  ATTEMPT=$((ATTEMPT + 1))
                  continue
                fi
                FAILED=$((FAILED + 1))
                STORE_DONE=1
                break
              fi

              echo "Store ${STORE_ID} failed (HTTP ${HTTP_CODE}, attempt ${ATTEMPT})"
              cat "${RESP_FILE}"
              rm -f "${RESP_FILE}"
              FAILED=$((FAILED + 1))
              STORE_DONE=1
              break
            done

            if [ "${STORE_DONE}" -eq 0 ]; then
              FAILED=$((FAILED + 1))
            fi
            sleep 2
          done

          if [ "${FAILED}" -gt 0 ]; then
            echo "Preview warehouse refresh completed with ${FAILED} failed store(s), ${RATE_LIMITED} rate-limited store(s)"
            exit 1
          fi

          echo "Preview warehouse refresh completed successfully (${RATE_LIMITED} rate-limited store(s) skipped)"
